name: engineering-playground-saga
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saga}
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga_local}
    ports:
      - "${POSTGRES_PORT:-5545}:5432"
    volumes:
      - saga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Orders: "Host=postgres;Database=${POSTGRES_DB:-saga};Username=${POSTGRES_USER:-saga};Password=${POSTGRES_PASSWORD:-saga_local}"
    ports:
      - "${API_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  saga-data:
