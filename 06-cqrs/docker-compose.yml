services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cqrs}
      POSTGRES_USER: ${POSTGRES_USER:-cqrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cqrs_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/EngineeringPlayground.Cqrs.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Cqrs: Host=postgres;Port=5432;Database=${POSTGRES_DB:-cqrs};Username=${POSTGRES_USER:-cqrs};Password=${POSTGRES_PASSWORD:-cqrs_local_password};GSS Encryption Mode=Disable
    ports:
      - "${API_PORT:-8086}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
